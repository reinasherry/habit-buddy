<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4CD964">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Buddy">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Habit Buddy</title>

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('hb_theme');
        var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch(e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="setup-screen" id="setupScreen">
  <div class="setup-card">
    <h1>Meet your buddy! 👋</h1>
    <p>Choose a companion. They will judge you.</p>
    <div class="char-grid" id="charGrid"></div>
    <input id="charNameInput" placeholder="Name your buddy..." maxlength="12" autocomplete="off">
    <button onclick="startJourney()">Start My Journey ✨</button>
  </div>
</div>

<div id="mainApp" class="hidden">
  <div class="partner-screen hidden" id="partnerScreen">
  <div id="partnerContent"></div>
</div>
  <div class="header">
  <div>
    <div class="hi">Hi there! 👋</div>
    <div class="sub">They're watching. Always watching.</div>
  </div>
  <div class="header-right">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
    <div class="xp" id="xpBadge">⭐ <span id="xpVal">0</span> XP</div>
  </div>
</div>
  <div id="content"></div>
      <div class="nav">
    <button class="nitem" data-tab="glance" onclick="switchTab('glance')"><span class="ic">⚡</span><div class="lb">Glance</div></button>
    <button class="nitem active" data-tab="today" onclick="switchTab('today')"><span class="ic">🏠</span><div class="lb">Today</div></button>
    <button class="nitem" data-tab="chat" onclick="switchTab('chat')"><span class="ic">💬</span><div class="lb">Chat</div></button>
    <button class="nitem" data-tab="stats" onclick="switchTab('stats')"><span class="ic">📊</span><div class="lb">Stats</div></button>
    <button class="nitem" data-tab="profile" onclick="switchTab('profile')"><span class="ic">👤</span><div class="lb">Profile</div></button>
  </div>
</div>

<div class="modal" id="chModal"><div class="mbox">
  <div class="big">🎲</div><h3>Random Challenge</h3>
  <p id="chText"></p><div class="xp2" id="chXp"></div>
  <button class="pbtn" onclick="completeChallenge()">I did it! 🎉</button>
  <button class="skip" id="skipBtn" onclick="skipChallenge()">Skip</button>
</div></div>

<div class="modal" id="addModal"><div class="mbox">
  <div class="big">✨</div><h3>Add a Habit</h3>
  <input id="nName" placeholder="Habit name (e.g., Stretch)">
  <input id="nIcon" placeholder="Emoji (e.g. 🧘)" maxlength="2">
  <input id="nGoal" placeholder="Daily goal number" type="number">
  <select id="nFreq" class="sel">
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
  </select>
  <input id="nReminder" type="time" class="sel">
  <div class="days-row" id="nDays"></div>
  <button class="pbtn" style="margin-top:16px" onclick="addHabit()">Add Habit</button>
  <button class="skip" onclick="closeModal('addModal')">Cancel</button>
</div></div>

<div class="modal" id="journalModal"><div class="mbox">
  <div class="big">📔</div><h3>New entry</h3>
  <p class="jq" id="journalPrompt"></p>
  <select id="jExcuse" class="sel">
    <option value="">Why did you neglect them today?</option>
    <option value="Netflix">Netflix</option>
    <option value="TikTok">TikTok</option>
    <option value="Existential dread">Existential dread</option>
    <option value="I forgot they existed">I forgot they existed</option>
    <option value="Napping (ironic)">Napping (ironic)</option>
    <option value="Refusing to acknowledge reality">Refusing to acknowledge reality</option>
  </select>
  <textarea id="jText" placeholder="Confess everything..." rows="3"></textarea>
  <div class="mood-pick" id="moodPick"></div>
  <button class="pbtn" style="margin-top:10px" onclick="saveJournal()">Save (and apologize)</button>
  <button class="skip" onclick="closeModal('journalModal')">Cancel</button>
</div></div>

<div class="modal" id="charPickModal"><div class="mbox">
  <div class="big">🎨</div><h3>Choose a new buddy</h3>
  <div class="char-grid" id="charGridModal"></div>
  <button class="skip" onclick="closeModal('charPickModal')">Cancel</button>
</div></div>
<div class="modal" id="deleteModal">
  <div class="mbox mbox-small">
    <div class="big">🗑️</div>
    <h3>Delete this habit?</h3>
    <p class="del-habit-name" id="delHabitName"></p>
    <p class="del-warn" id="delWarnText"></p>
    <button class="pbtn danger-pbtn" onclick="confirmDelete()">Yes, delete it</button>
    <button class="skip" onclick="closeModal('deleteModal')">Nevermind, keep it</button>
  </div>
</div>
<div class="modal" id="renameModal">
  <div class="mbox mbox-small">
    <div class="big">✏️</div>
    <h3>Rename your buddy</h3>
    <p class="rename-sub" id="renameSub">Give them a name worth judging you with.</p>
    <input id="renameInput" placeholder="New name..." maxlength="12" autocomplete="off">
    <div class="rename-counter" id="renameCounter">0/12</div>
    <button class="pbtn" onclick="confirmRename()">Save name</button>
    <button class="skip" onclick="closeModal('renameModal')">Cancel</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
